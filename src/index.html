<!doctype html>
<html lang="en">
  <head>
    <link
      rel="preconnect"
      href="https://fonts.googleapis.com"
    >
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin="anonymous"
    >
    <link
      href="https://fonts.googleapis.com/css2?family=Roboto:wght@500&display=swap"
      rel="stylesheet"
    >
    <meta charset="UTF-8">
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, initial-scale=1.0,
        maximum-scale=1.0, minimum-scale=1.0"
    >
    <meta
      http-equiv="X-UA-Compatible"
      content="ie=edge"
    >
    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    >
  </head>
  <body class="body__container">
    <header class="header header__cotainer">
      <a
        class="header__img"
        href="/"
      >
        <img
          class="img"
          src="images/logo.png"
          alt="Moyo logo"
        >
      </a>

      <nav class="navigation__container">
        <ul class="nav__all-links">
          <li class="li__link link__apple">
            <a
              class="a__link is-active"
              href="#"
            >
              apple
            </a>
          </li>

          <li class="li__link link__samsung">
            <a
              class="a__link"
              href="#"
            >
              samsung
            </a>
          </li>

          <li class="li__link link__smartphones">
            <a
              class="a__link"
              href="#"
            >
              smartphones
            </a>
          </li>

          <li class="li__link link__laptops">
            <a
              class="a__link"
              href="#"
              data-qa="hover"
            >
              laptops & computers
            </a>
          </li>

          <li class="li__link link__gadgets">
            <a
              class="a__link"
              href="#"
            >
              gadgets
            </a>
          </li>

          <li class="li__link link__tablets">
            <a
              class="a__link"
              href="#"
            >
              tablets
            </a>
          </li>

          <li class="li__link link__photo">
            <a
              class="a__link"
              href="#"
            >
              photo
            </a>
          </li>

          <li class="li__link link__video">
            <a
              class="a__link"
              href="#"
            >
              video
            </a>
          </li>
        </ul>
      </nav>
    </header>
  </body>
</html>
